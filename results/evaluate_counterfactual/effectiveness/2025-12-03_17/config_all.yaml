image_data:
  name: 'morphomnist'
  data_dir: '/home/hashikami/datadrive/morphomnist_all_model'
  image_size: 28
  use_minmax_scale: false
  meta_data:
    d: 4
    # cond_stats_path: 'dataset/cond_stats.json'
    causalgraph_path: 'dataset/B_true.npy'
    attribute_size_path: 'dataset/attribute_size.json'
    graph_path: 'dataset/causal_graph.json'


diffusion:
  noise_schedule: 'linear'
  timesteps: 500
  unet:
    model_path: '/home/hashikami/projects/Diff/diffusion/diffusion_model/models/model11.py'
    ch_mul: [1,2,4]
    num_res_blocks: 1
    num_groups: 16
    droprate: 0.0
    cond_type: 'add'
    use_attn: false
  cfg:
    uncond_rate: 0.1
    guidance_scale: 0.1
  checkpoint_path: '/home/hashikami/checkpoint/diffusion_model_denoiser/checkpoint_2025-12-01_19.pth'

diffusion_training:
  epochs: 500
  batch_size: 256
  optim:
    type: 'Adam'
  checkpoint_dir: '/home/hashikami/checkpoint/diffusion_model_denoiser'

notears:
  method: 'mlp'
  lambda1: 0.01
  w_threshold: 0.3

carefl:
  net_class: 'mlp4'
  nh: 100
  prior_dist: 'normal'
  scale_shift_base: true
  inverse_model: true

carefl_training:
  epochs: 3
  batch_size: 256

evaluate:
  batch_size: 256
  run_causaldiscovery: false
