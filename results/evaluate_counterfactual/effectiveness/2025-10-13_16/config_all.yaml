image_data:
  name: 'morphomnist'
  image_size: 28
  use_minmax_scale: false
  meta_data:
    d: 4
    cond_stats_path: 'dataset/cond_stats.json'
    causalgraph_path: 'dataset/B_true.npy'


diffusion:
  noise_schedule: 'linear'
  timesteps: 500
  unet:
    ch_mul: [1,2,4]
    num_res_blocks: 1
    num_groups: 16
    droprate: 0.0
    cond_type: 'add'
    use_attn: false
  cfg:
    uncond_rate: 0.1
  checkpoint_path: '/home/hashikami/checkpoint/checkpoint_2025-09-30_15.pth'

diffusion_training:
  epochs: 100
  batch_size: 64
  optim:
    type: 'Adam'

notears:
  method: 'mlp'
  lambda1: 0.1
  w_threshold: 0.3

carefl:
  net_class: 'mlp4'
  nh: 100
  prior_dist: 'normal'
  scale_shift_base: true
  inverse_model: true

carefl_training:
  epochs: 30
  batch_size: 128

evaluate:
  batch_size: 128
